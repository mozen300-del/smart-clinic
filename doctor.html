<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطبيب - Smart Clinic</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; direction: rtl; text-align: right; }
        header { background-color: #16a085; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .card-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fdfefe; border: 1px solid #d5dbdb; border-right: 5px solid #16a085; padding: 20px; border-radius: 8px; }
        .card h3 { margin-top: 0; color: #16a085; }
        .status { color: #e67e22; font-weight: bold; }
        .btn { background-color: #2980b9; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #1f618d; }
    </style>
</head>
<body>

    <header>لوحة تحكم الطبيب (Doctor Dashboard)</header>

    <div class="container">
        <h2>👨‍⚕️ المواعيد والقاءات الطبية القادمة</h2>
        
        <div class="card-grid">
            <div class="card">
                <h3>الموعد رقم: #A300</h3>
                <p><strong>اسم المريض:</strong> محمد أحمد</p>
                <p><strong>تاريخ ووقت الموعد:</strong> 2026-11-15 | 10:00 AM</p>
                <p><strong>الحالة:</strong> <span class="status">مؤكد (Confirmed)</span></p>
                <button class="btn" onclick="alert('جاري فتح السجل الطبي وتاريخ المريض المرضي...')">عرض السجل الطبي للمريض</button>
            </div>
            
            <div class="card">
                <h3>الموعد رقم: #A301</h3>
                <p><strong>اسم المريض:</strong> فاطمة عثمان</p>
                <p><strong>تاريخ ووقت الموعد:</strong> 2026-11-15 | 11:30 AM</p>
                <p><strong>الحالة:</strong> <span class="status">في انتظار التأكيد</span></p>
                <button class="btn" onclick="alert('تم تحديث حالة الموعد وتأكيده بنجاح!')">تأكيد الموعد</button>
            </div>
        </div>
    </div>

</body>
</html>
